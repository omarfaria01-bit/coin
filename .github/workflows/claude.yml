# Claude Code as manager. Setup: install the Claude GitHub App on this repo and add the
# repository secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`). Steps: the needs:kiwi setup issue.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]
  schedule:
    - cron: "17 */3 * * *" # manager tick every 3h
  workflow_dispatch:

jobs:
  respond:
    # Only kiwi and Grok can trigger Claude, and only with an @claude mention.
    if: >-
      github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' &&
      contains(fromJSON('["omarfaria01-bit","omarmissaoui2009-ship-it"]'), github.actor) &&
      (contains(github.event.comment.body, '@claude') ||
       contains(github.event.review.body, '@claude') ||
       contains(github.event.issue.body, '@claude') ||
       contains(github.event.issue.title, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v6
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 25
            --allowedTools "Bash(gh:*),Bash(git:*),Bash(uv:*),Read,Edit,Write,Grep,Glob"

  tick:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-tick
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude,claude[bot],github-actions[bot]"
          prompt: |
            You are the manager of ${{ github.repository }}. Run the "Manager tick" procedure in
            CLAUDE.md exactly, then stop. Commit only coord/STATE.md (and coord/BUDGET.md) in this
            run, directly to main, with a message starting "tick:".
          claude_args: |
            --max-turns 15
            --allowedTools "Bash(gh:*),Bash(git:*),Read,Edit,Write,Grep,Glob"
