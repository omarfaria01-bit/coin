[project]
name = "coin-system"
version = "0.1.0"
description = "Deterministic reward engine, simulator and launch tooling for a Solana memecoin"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "networkx>=3.2",
  "numpy>=1.26",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
