# audit #271 M5 (D39): run unprivileged, write only the logo files and its cache
[Service]
User=gtasp10-logo
Group=gtasp10-logo
ReadWritePaths=/var/www/gtasp10
CacheDirectory=gtasp10-logo
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
NoNewPrivileges=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictAddressFamilies=AF_INET AF_INET6
RestrictSUIDSGID=true
LockPersonality=true
MemoryMax=512M
CapabilityBoundingSet=
